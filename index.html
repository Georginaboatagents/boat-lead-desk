<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boat Lead Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boat Leads">
<meta name="theme-color" content="#9478F3">
<style>
/* ============ VERSION 3 DESIGN SYSTEM ============
   Soft mid-purple canvas (cloned from approved inspiration) ·
   white floating cards · purple/teal tier cards w/ 3D icon chips ·
   icon-first, minimal text, generous negative space.
   Spacing: 4 8 12 16 20 24 32 44 60 · display type ui-rounded     */
:root{
  --card:#FFFFFF; --ink:#221A45; --ink2:#6B6590; --ink3:#9B96B8;
  --violet:#6C4CF1; --violet-deep:#5433DB; --violet-soft:#F1EDFE;
  --p1:#B292FA; --p2:#8258EC;          /* tier 1 */
  --g1:#5FE3C6; --g2:#2BBFA4;          /* tier 2 */
  --t1a:#FF7A47; --t1b:#FFA245;        /* alert coral */
  --danger:#D6486B; --danger-soft:#FDF0F3;
  --r:26px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
/* decorations poke past the screen edge — clip them so the page can't pan sideways */
html, body{overflow-x:hidden; max-width:100vw;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} }
body{
  margin:0; color:#fff;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(80% 30% at 90% 0%, rgba(255,255,255,.2), transparent 60%),
    radial-gradient(60% 25% at 5% 45%, rgba(255,255,255,.1), transparent 70%),
    linear-gradient(170deg, #9478F3 0%, #815FEA 48%, #7351E2 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top)) 22px calc(80px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px; margin:0 auto; position:relative; z-index:1;}

/* ---- decorations ---- */
.deco{position:absolute; color:rgba(255,255,255,.4); font-weight:300; pointer-events:none; z-index:0;}
.orb{position:absolute; border-radius:50%; filter:blur(30px); pointer-events:none; z-index:0;}
.mini{position:absolute; border-radius:12px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 24px rgba(60,30,150,.3); pointer-events:none; z-index:0;}
.mini.m1{width:36px;height:36px; background:linear-gradient(150deg,#FFB68A,#FF8A65); transform:rotate(-8deg);}
.mini.m2{width:32px;height:32px; background:linear-gradient(150deg,#6FE6CC,#33C4AC); transform:rotate(10deg);}
.mini.m3{width:30px;height:30px; background:linear-gradient(150deg,#FFD98A,#FFB84D); transform:rotate(-12deg);}

/* ---- scroll progress ---- */
#progress{position:fixed; top:0; left:0; height:3px; width:0%;
  background:linear-gradient(90deg,#5FE3C6,#FFB35C); z-index:60; border-radius:0 3px 3px 0;}

/* ---- header ---- */
header{display:flex; align-items:center; gap:11px; position:relative; z-index:1;}
.logo{width:40px; height:40px; border-radius:13px; background:rgba(255,255,255,.2); flex:0 0 auto;
  border:1px solid rgba(255,255,255,.32); display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
h1{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif; font-size:20px; font-weight:800;
  letter-spacing:-.02em; margin:0;}
.hdr-sub{font-size:11.5px; color:rgba(255,255,255,.68); margin-top:1px; display:flex; align-items:center; gap:5px;}
.hdr-sub .dot{width:6px;height:6px;border-radius:50%;background:#4FF0CC;display:inline-block; flex:0 0 auto;}
.hdr-sub.off .dot{background:rgba(255,255,255,.45);}
.bell{margin-left:auto; width:40px; height:40px; border-radius:13px; background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.32); display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; color:#fff; flex:0 0 auto;}
.bell:active{transform:scale(.94);}

/* ---- hero ---- */
.hero{display:flex; align-items:center; margin:40px 0 6px; position:relative;}
.hero-num{font-family:ui-rounded,-apple-system,sans-serif; font-size:clamp(64px,20vw,88px); font-weight:800;
  line-height:.9; letter-spacing:-.05em; text-shadow:0 10px 36px rgba(50,20,140,.3);}
.hero-lbl{font-size:15px; color:rgba(255,255,255,.85); font-weight:600; margin-top:10px;}
.hero-date{font-size:11.5px; color:rgba(255,255,255,.55); margin-top:5px;}
.hero-art{margin-left:auto; width:min(180px,46vw); height:150px; position:relative; flex:0 0 auto;}
.hero-art svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.boat-float{animation:bob 5s ease-in-out infinite; transform-origin:50% 60%;}
.wave-drift{animation:drift 7s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(-1.6deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
@media (prefers-reduced-motion:reduce){ .boat-float,.wave-drift{animation:none;} }

/* ---- tier cards ---- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:40px;}
.tile{border-radius:var(--r); padding:22px 16px 20px; color:#fff; position:relative; overflow:hidden;
  text-align:center; border:none; font:inherit; cursor:pointer; transition:transform .18s ease;}
.tile:active{transform:scale(.97);}
.tile.t1{background:linear-gradient(160deg,var(--p1),var(--p2)); box-shadow:0 20px 44px rgba(85,45,200,.42);}
.tile.t2{background:linear-gradient(160deg,var(--g1),var(--g2)); box-shadow:0 20px 44px rgba(18,150,125,.38);}
.tile .ic{width:96px; height:96px; border-radius:30px; display:flex; align-items:center;
  justify-content:center; margin:0 auto 16px; position:relative;
  box-shadow:0 18px 34px rgba(40,15,110,.34), inset 0 3px 5px rgba(255,255,255,.75);}
.tile.t1 .ic{background:linear-gradient(160deg,#FFD9A4 0%,#FFB466 55%,#FF9847 100%);}
.tile.t2 .ic{background:linear-gradient(160deg,#F3EDFF 0%,#DFD2FF 55%,#C7B2FF 100%);}
.tile .n{font-family:ui-rounded,-apple-system,sans-serif; font-size:46px; font-weight:800; line-height:1;
  letter-spacing:-.04em;}
.tile .l{font-size:10.5px; font-weight:800; letter-spacing:.16em; opacity:.9; margin-top:7px;}
.tile .shine{position:absolute; top:-30px; right:-30px; width:110px; height:110px; border-radius:50%;
  background:rgba(255,255,255,.16); filter:blur(2px);}

/* ---- voice note ---- */
.voice-note{margin-top:24px; border-radius:18px; padding:13px 16px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:rgba(255,255,255,.92); font-size:13px; line-height:1.5;}
.voice-note b{color:#fff;}

/* ---- section heads ---- */
.sec{display:flex; align-items:center; gap:11px; margin:48px 2px 6px;}
.sec .ic{width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.sec.t1 .ic{background:linear-gradient(160deg,var(--p1),var(--p2)); box-shadow:0 8px 18px rgba(85,45,200,.45);}
.sec.t2 .ic{background:linear-gradient(160deg,var(--g1),var(--g2)); box-shadow:0 8px 18px rgba(18,150,125,.4);}
.sec h2{font-family:ui-rounded,-apple-system,sans-serif; font-size:21px; font-weight:800; margin:0; letter-spacing:-.02em;}
.sec .n{margin-left:auto; font-family:ui-rounded,-apple-system,sans-serif; font-size:21px; font-weight:800;
  color:rgba(255,255,255,.6);}

/* ---- lead cards ---- */
.card{background:var(--card); color:var(--ink); border-radius:var(--r); padding:22px 20px 18px;
  margin-top:18px; box-shadow:0 22px 50px rgba(58,28,150,.3); position:relative;
  transition:transform .3s ease, opacity .3s ease;}
.card.leaving{opacity:0; transform:translateX(40px) scale(.96);}
.reveal{opacity:0; transform:translateY(18px);}
.reveal.in{opacity:1; transform:none; transition:opacity .5s ease, transform .5s ease;}
@media (prefers-reduced-motion:reduce){ .reveal{opacity:1; transform:none;} .card{transition:none;} }
.row1{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.catic{width:38px; height:38px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  flex:0 0 auto; color:#fff;}
.val{font-size:12px; font-weight:800; color:var(--violet); background:var(--violet-soft);
  border-radius:9px; padding:5px 11px;}
.when{margin-left:auto; font-size:12px; color:var(--ink3); font-weight:600; flex:0 0 auto;}
.who{margin:16px 0 2px; font-size:19px; font-weight:800; letter-spacing:-.02em;}
.grp{font-size:12.5px; color:var(--ink3); font-weight:600;}
.post{margin:14px 0 0; font-size:13.5px; font-style:italic; color:#5A5480; line-height:1.5; white-space:pre-line;}
.post.clamped{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  white-space:normal;}
.more{font:inherit; font-size:12px; font-weight:800; color:var(--violet); margin-top:5px;
  background:none; border:none; padding:4px 0; cursor:pointer; display:block;}
.dm{margin-top:16px; background:#F8F6FF; border-radius:16px; padding:13px 15px;}
.dm-head{display:flex; align-items:center; margin-bottom:7px;}
.dm-head .t{font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--ink3);}
.dm-head .v{margin-left:auto; font-size:10.5px; font-weight:800; color:#12A08A; background:#E2F7F2;
  border-radius:12px; padding:2px 9px;}
.dm-body{font-size:13.5px; color:#3A3363; white-space:pre-line; line-height:1.5;}

/* ---- buttons ---- */
.btns{display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; align-items:center;}
.btn{display:inline-flex; align-items:center; gap:7px; border-radius:14px; padding:11px 16px;
  font:inherit; font-size:13px; font-weight:800; border:none; cursor:pointer; transition:transform .15s ease;
  text-decoration:none;}
.btn:active{transform:scale(.95);}
.btn:focus-visible{outline:3px solid rgba(108,76,241,.4); outline-offset:2px;}
.btn.copy{background:linear-gradient(120deg,#8258EC,#6C4CF1); color:#fff; position:relative; overflow:hidden;
  box-shadow:0 10px 22px rgba(108,76,241,.35);}
.btn.copy::after{content:""; position:absolute; top:0; left:-80%; width:50%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg); animation:shine 4.5s ease-in-out infinite;}
@keyframes shine{0%,72%{left:-80%}88%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){ .btn.copy::after{animation:none; display:none;} }
.btn.open{background:#FBFAFF; color:var(--ink); border:1.5px solid #ECE8FA;}
.btn.ok{background:#E2F7F2; color:#0E9782;}
.btn.del{background:var(--danger-soft); color:var(--danger); margin-left:auto;}

/* ---- empty & skeleton ---- */
.empty{border-radius:20px; border:1.5px dashed rgba(255,255,255,.4); margin-top:18px; padding:28px 18px;
  text-align:center; color:rgba(255,255,255,.8); font-size:13.5px; background:rgba(255,255,255,.08);}
.empty svg{width:52px; height:52px; margin:0 auto 8px; display:block; opacity:.85;}
.skel{border-radius:var(--r); height:200px; margin-top:18px;
  background:linear-gradient(100deg,rgba(255,255,255,.16) 40%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.16) 60%);
  background-size:200% 100%; animation:shimmer 1.4s linear infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){ .skel{animation:none;} }

/* ---- handled ---- */
details.handled{margin-top:34px; border-radius:20px; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28); overflow:hidden;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
details.handled summary{padding:14px 18px; font-weight:800; font-size:14px; color:rgba(255,255,255,.9);
  cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;}
details.handled summary::-webkit-details-marker{display:none;}
details.handled summary .hn{margin-left:auto; background:rgba(255,255,255,.22); color:#fff;
  border-radius:14px; padding:2px 10px; font-size:12px;}
.hrow{display:flex; align-items:center; gap:10px; padding:11px 18px;
  border-top:1px solid rgba(255,255,255,.16); font-size:13.5px; color:rgba(255,255,255,.92);}
.hrow .nm{font-weight:700;}
.hrow .st{font-size:10.5px; font-weight:800; letter-spacing:.06em; border-radius:6px; padding:2px 8px;}
.hrow .st.c{color:#0E9782; background:#E2F7F2;}
.hrow .st.d{color:var(--danger); background:var(--danger-soft);}
.hrow .undo{margin-left:auto; font:inherit; font-size:12.5px; font-weight:800; color:#fff;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); border-radius:10px;
  cursor:pointer; padding:6px 12px;}

/* ---- toast ---- */
#toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(90px); display:flex; align-items:center; gap:12px;
  background:rgba(34,26,69,.94); color:#F0EDFF; padding:11px 18px; border-radius:26px;
  font-size:14px; font-weight:600; transition:transform .28s ease; z-index:80;
  box-shadow:0 10px 30px rgba(34,26,69,.35); backdrop-filter:blur(8px); max-width:88vw;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast button{font:inherit; font-size:13px; font-weight:800; color:#C9B8FF; background:none;
  border:none; cursor:pointer; padding:2px 2px;}

.foot{text-align:center; margin-top:56px; color:rgba(255,255,255,.45); font-size:11px;}
svg{display:block;}
</style>
</head>

  <span class="deco" style="top:268px; right:6px; font-size:17px;">+</span>
  <div class="orb" style="top:90px; right:-30px; width:120px; height:120px; background:rgba(255,255,255,.16);"></div>
  <div class="mini m1" style="top:118px; right:150px;" aria-hidden="true">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="2"/><path d="M12 4v4m0 8v4M4 12h4m8 0h4" stroke="#fff" stroke-width="2"/></svg>
  </div>
  <div class="mini m2" style="top:236px; left:-4px;" aria-hidden="true">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm0 4v11m-7-6c0 4 3 6.5 7 6.5s7-2.5 7-6.5M5 13l-2 1.5M19 13l2 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="mini m3" style="top:70px; left:120px;" aria-hidden="true">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.6H20l-4.7 3.4 1.8 5.6L12 14.2l-5.1 3.4 1.8-5.6L4 8.6h6.2L12 3Z" fill="#fff"/></svg>
  </div>

  <header>
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
        <path d="M18 20v-5c0-1.1.9-2 2-2h6c3 0 5.4 1.6 7 4l2 3H18Z" fill="#fff" opacity=".92"/>
        <path d="M9 23h30c-.8 4.5-4.2 7.5-8.5 8.5H17C13 30.5 10.5 27.5 9 23Z" fill="#fff"/>
        <path d="M6 36c3.5-2.4 7-2.4 10.5 0s7 2.4 10.5 0 7-2.4 10.5 0" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
      </svg>
    </div>
    <div>
      <h1>Boat Lead Desk</h1>
      <div class="hdr-sub" id="syncWrap"><span class="dot"></span><span id="queueLabel">—</span>&nbsp;·&nbsp;<span id="syncStatus">syncing…</span></div>
    </div>
    <button class="bell" id="bellBtn" style="display:none" aria-label="Turn on instant Tier 1 alerts">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 0-6 6v3.6l-1.6 3.2c-.3.7.1 1.2.9 1.2h13.4c.8 0 1.2-.5.9-1.2L18 12.6V9a6 6 0 0 0-6-6Zm-2 16a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="hero reveal">
    <div>
      <div class="hero-num" id="heroNum">–</div>
      <div class="hero-lbl">open leads on deck</div>
      <div class="hero-date" id="dateLabel"></div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 180 150" fill="none">
        <defs>
          <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDD3FF"/></linearGradient>
          <linearGradient id="hull2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F0FF"/><stop offset="1" stop-color="#C9BAFF"/></linearGradient>
          <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(255,255,255,.45)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>
          <radialGradient id="sun2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD489"/><stop offset="1" stop-color="#FFAE5C"/></radialGradient>
          <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FF0D6"/><stop offset="1" stop-color="#2BD4B4"/></linearGradient>
        </defs>
        <ellipse cx="95" cy="80" rx="85" ry="60" fill="url(#glow)"/>
        <circle cx="146" cy="26" r="15" fill="url(#sun2)"/>
        <circle cx="146" cy="26" r="21" stroke="rgba(255,212,137,.45)" stroke-width="2"/>
        <g class="boat-float">
          <path d="M62 62v-8c0-2 1.5-3.5 3.5-3.5H84c5 0 9 2.2 12 6l3 5.5H62Z" fill="url(#hull2)"/>

          <path d="M34 78h120l-2 6.5H36.5Z" fill="#B7A5FF" opacity=".6"/>
        </g>
        <g class="wave-drift">
          <path d="M12 114c10-6.5 20-6.5 30 0s20 6.5 30 0 20-6.5 30 0 20 6.5 30 0 20-6.5 30 0" stroke="url(#wv)" stroke-width="5.5" stroke-linecap="round"/>
          <path d="M2 130c10-6.5 20-6.5 30 0s20 6.5 30 0 20-6.5 30 0 20 6.5 30 0 20-6.5 30 0" stroke="#2BD4B4" stroke-width="4" stroke-linecap="round" opacity=".45"/>
        </g>
        <circle cx="30" cy="40" r="2.5" fill="rgba(255,255,255,.8)"/>
        <circle cx="164" cy="66" r="2" fill="rgba(255,255,255,.7)"/>
        <circle cx="52" cy="22" r="1.8" fill="rgba(255,255,255,.6)"/>
      </svg>
    </div>
  </div>

  <div class="tiles reveal">
    <button class="tile t1" id="tileT1" aria-label="Jump to Tier 1">
      <div class="shine"></div>
      <div class="ic">
        <svg width="76" height="76" viewBox="0 0 48 48" fill="none">
          <defs>
            <linearGradient id="b3a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DBFF"/></linearGradient>
            <linearGradient id="b3b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8F6BF2"/><stop offset="1" stop-color="#5C33D6"/></linearGradient>
          </defs>
          <ellipse cx="24" cy="40.5" rx="16" ry="3.4" fill="#A64E12" opacity=".4"/>
          <path d="M16.5 21v-5c0-1.3 1-2.3 2.3-2.3h7.6c3.3 0 6 1.6 7.9 4.2l2.2 3.1H16.5Z" fill="url(#b3a)" stroke="#B9A2F5" stroke-width="1.2"/>

<script>
// ================== CONFIG ==================
const SYNC_URL = "https://script.google.com/macros/s/AKfycbzm0-aDuq9gCxE_cYfaZFy066vU15nZSrvNG0LDlxyrMVT8Mw7tcJGVezKSwBhjfUN3/exec"; // shared store (Google Apps Script on Georgina's account)

// Public half of the push keypair (the private half lives only in the hourly task).
const VAPID_PUBLIC = "BJQGvulSdMUGhiyug1z827ALZlxGmDY3_aOdkmFfPVBP4s_mMhsM0zcnPa63V2fmvMB3UgRw-elu4fmc63cv01Y";

let LEADS = [];
// contacted / deleted: { leadId: {v: bool, t: epoch_ms} } — last write wins per lead
let contacted = {}, deleted = {};
try { contacted = JSON.parse(localStorage.getItem("bld-contacted") || "{}"); } catch(e) {}
try { deleted   = JSON.parse(localStorage.getItem("bld-deleted")   || "{}"); } catch(e) {}
let seen = {};
try { seen = JSON.parse(localStorage.getItem("bld-seen") || "{}"); } catch(e) {}

function saveLocal(){
  try {
    localStorage.setItem("bld-contacted", JSON.stringify(contacted));
    localStorage.setItem("bld-deleted",   JSON.stringify(deleted));
    localStorage.setItem("bld-seen",      JSON.stringify(seen));
  } catch(e){}
}
function isDone(id){ return !!(contacted[id] && contacted[id].v); }
function isDeleted(id){ return !!(deleted[id] && deleted[id].v); }
function isHandled(id){ return isDone(id) || isDeleted(id); }

// ---- category icons: gradient squircle + white glyph (icon-first design) ----
const IC = {

  wrench:  '<path d="M14.5 6.5a4 4 0 0 0-5.4 5L4 16.6V20h3.4l5.1-5.1a4 4 0 0 0 5-5.4l-2.8 2.8-2.4-.6-.6-2.4 2.8-2.8Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>',

  sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" fill="#fff"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6Z" fill="#fff" opacity=".85"/>',
  jetski:  '<path d="M7 8.5 10.5 6l2 2.5 3 1L18 12H9l-2-3.5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M3 15h18c-1.2 2.4-3.4 3.6-6 4H8c-2.6-.4-4-1.8-5-4Z" fill="#fff"/>',
  helm:    '<circle cx="12" cy="12" r="6" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="1.8" fill="#fff"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M6 6l2 2m8 8 2 2M18 6l-2 2M8 16l-2 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  boat:    '<path d="M4 12h16l-2 4H6l-2-4Zm4 0V8h6l2.5 4M3 19c2.5-1.8 5-1.8 7.5 0s5 1.8 7.5 0" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
};
const CAT_META = {
  "Buying — Active":       {g:["#7FA5FF","#4E71E8"], i:"search"},
  "Buying — Researching":  {g:["#5BC9E8","#2596BE"], i:"compass"},
  "Selling — Active":      {g:["#FFA25C","#F0662F"], i:"tag"},
  "Selling — Considering": {g:["#F5C862","#D89A1E"], i:"tag"},
  "Valuation":             {g:["#B8D46A","#7FA33A"], i:"scales"},
  "Upgrade / Downsize":    {g:["#B78CF7","#8B54E8"], i:"updown"},
  "Pro Referral":          {g:["#F78CC8","#E0479B"], i:"refer"},
  "Service & Repair":      {g:["#5FE3C6","#2BBFA4"], i:"wrench"},
  "Logistics":             {g:["#8C9BF7","#5468E8"], i:"box"},
  "Transport":             {g:["#8C9BF7","#5468E8"], i:"truck"},
  "Distress Signal":       {g:["#FF8A80","#E8483C"], i:"ring"},

};
function catMeta(l){
  const key = (l.cat || "").replace(/\s*[—-]\s*/, " — ");
  return CAT_META[key] || CAT_META[l.cat] || {g:["#A99BF7","#7B5FE8"], i:"boat"};
}

// Legacy tiers map into the two-tier system so old store docs still render.
function leadTier(l){
  if (l.tier === "tier1" || l.tier === "hot") return "tier1";
  return "tier2";
}

function mergeMap(local, remote){
  let changed = false;
  for (const id in remote){
    const r = remote[id], l = local[id];
    if (!l || (r.t || 0) > (l.t || 0)) { local[id] = r; changed = true; }
  }
  return changed;
}

// The shared store is one doc: { contacted: {...}, deleted: {...}, leads_doc: {...} },
// served by a Google Apps Script on Georgina's account. Reads are open;
// publishing leads requires a secret the hourly task holds; contacted/deleted
// marks merge server-side one lead at a time. Older store shapes still normalize.
function normalizeDoc(raw){
  if (raw && typeof raw === "object" && (raw.contacted || raw.deleted || raw.leads_ref || raw.leads_doc)) return raw;
  return { contacted: (raw && typeof raw === "object") ? raw : {} };
}

let leadsRefV = "";
async function applyLeadsRef(ref){
  try {
    if (!ref || !ref.parts || !ref.parts.length || ref.v === leadsRefV) return;
    const chunks = await Promise.all(ref.parts.map(u =>
      fetchT(u + "?t=" + Date.now(), {cache:"no-store"}).then(r => r.json())));
    chunks.sort((a,b) => (a.part||0) - (b.part||0));
    const bytes = Uint8Array.from(atob(chunks.map(c => c.data).join("")), c => c.charCodeAt(0));
    let text;
    if (ref.gz) {
      if (typeof DecompressionStream === "undefined") return;
      text = await new Response(new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream("gzip"))).text();
    } else {
      text = new TextDecoder().decode(bytes);
    }
    leadsRefV = ref.v;
    applyLeadsDoc(JSON.parse(text));
  } catch(e){ /* any failure: keep the leads bundled with the site */ }
}

let leadsStamp = "", seenInit = !!localStorage.getItem("bld-seen-init");
function applyLeadsDoc(doc){
  if (!doc || !doc.leads) return;
  const full = JSON.stringify([doc.date_label, doc.queue_label, doc.updated, doc.leads]);
  if (full === leadsStamp) return; // unchanged — don't re-render under the user
  leadsStamp = full;
  LEADS = doc.leads;
  document.getElementById("dateLabel").textContent = doc.date_label || "";
  document.getElementById("footDate").textContent = doc.date_label || "";
  document.getElementById("queueLabel").textContent = doc.queue_label || "";
  const vn = document.getElementById("voiceNote");
  if (doc.voice_note) { vn.innerHTML = doc.voice_note; vn.style.display = "block"; }
  else { vn.innerHTML = ""; vn.style.display = "none"; }

  // -------- instant Tier 1 alert --------
  const fresh = LEADS.filter(l => leadTier(l) === "tier1" && !seen[l.id] && !isHandled(l.id));
  LEADS.forEach(l => { seen[l.id] = 1; });
  saveLocal();
  if (seenInit && fresh.length) fireTierOneAlert(fresh);
  if (!seenInit) { seenInit = true; try{ localStorage.setItem("bld-seen-init","1"); }catch(e){} }

  render();
}

function fetchT(url, opts, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 8000);
  return fetch(url, Object.assign({}, opts, {signal: ctl.signal})).finally(() => clearTimeout(timer));
}

// Marks that failed to reach the store are queued and re-sent on later polls,
// so a flaky moment never silently loses a Contacted/Delete for the team.
let pending = {};
try { pending = JSON.parse(localStorage.getItem("bld-pending") || "{}"); } catch(e){}
function savePending(){ try { localStorage.setItem("bld-pending", JSON.stringify(pending)); } catch(e){} }

let syncTimer, syncFails = 0, retryTimer;
function syncFailed(){
  syncFails++;
  // The store (Google Apps Script) hiccups occasionally — retry soon and only
  // call it offline after three straight misses.
  setSync(syncFails >= 3 ? "offline — showing last leads" : "retrying sync…", false);
  clearTimeout(retryTimer);
  if (syncFails < 3) retryTimer = setTimeout(pullShared, 8000);
}
async function pullShared(){
  if (!SYNC_ENABLED) { setSync("on this device", false); return; }
  try {
    // Apps Script can take 10s+ on a cold start — give the store a generous window.
    const res = await fetchT(SYNC_URL + "?t=" + Date.now(), {cache:"no-store"}, 20000);
    if (res.ok || res.status === 404) {
      if (res.ok) {
        const remote = normalizeDoc(await res.json());
        if (remote.leads_doc) applyLeadsDoc(remote.leads_doc);
        applyLeadsRef(remote.leads_ref);
        let changed = mergeMap(contacted, remote.contacted || {});
        changed = mergeMap(deleted, remote.deleted || {}) || changed;
        if (changed) { saveLocal(); render(); }
      }
      syncFails = 0;
      setSync("up to date", true);
      flushPending();
    }
    else { syncFailed(); }
  } catch(e){ syncFailed(); }
}
async function pushShared(action, id){
  if (!SYNC_ENABLED || !id) return;
  try {
    // The store merges one lead at a time server-side, so we can never
    // clobber a teammate's mark or touch the leads themselves.
    const map = action === "deleted" ? deleted : contacted;
    const c = map[id] || {};
    await fetchT(SYNC_URL, {method:"POST",
      body: JSON.stringify({action:action, id:id, v:!!c.v, t:c.t || Date.now()})}, 20000);
    delete pending[action + ":" + id]; savePending();
    setSync("up to date", true);
  } catch(e){
    pending[action + ":" + id] = 1; savePending();
    setSync("saved here — will sync shortly", false);
  }
}
let flushing = false;
async function flushPending(){
  if (flushing) return;
  const keys = Object.keys(pending);
  if (!keys.length) return;
  flushing = true;
  try { for (const k of keys){ const i = k.indexOf(":"); await pushShared(k.slice(0, i), k.slice(i + 1)); } }
  finally { flushing = false; }
}
function setSync(msg, ok){
  const el = document.getElementById("syncStatus"); if (el) el.textContent = msg;
  const w = document.getElementById("syncWrap"); if (w) w.classList.toggle("off", !ok);
}

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

// -------- rendering --------
const io = ("IntersectionObserver" in window) ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.08}) : null;
function watchReveals(root){
  (root || document).querySelectorAll(".reveal:not(.in)").forEach(el => {
    if (io) io.observe(el); else el.classList.add("in");
  });
}

const SVGP = 'width="19" height="19" viewBox="0 0 24 24" fill="none"';
function leadCard(l){
  const m = catMeta(l);
  const card = document.createElement("div");
  card.className = "card reveal";
  card.id = "lead-" + l.id;
  const longPost = (l.post || "").length > 160;
  card.innerHTML = `
    <div class="row1">
      <div class="catic" style="background:linear-gradient(150deg,${m.g[0]},${m.g[1]}); box-shadow:0 8px 18px ${m.g[1]}55" title="${esc(l.cat)}" aria-label="${esc(l.cat)}">
        <svg ${SVGP}>${IC[m.i]}</svg>
      </div>
      ${l.est_value ? `<span class="val">${esc(l.est_value)}</span>` : ""}
      <span class="when">${esc(l.when)}</span>
    </div>
    <div class="who">${esc(l.name)}</div>
    <div class="grp">${esc(l.group)}</div>
    <p class="post${longPost ? " clamped" : ""}">${esc(l.post)}</p>
    ${longPost ? `<button class="more">Read full post</button>` : ""}
    <div class="dm">
      <div class="dm-head"><span class="t">SUGGESTED DM</span><span class="v">${esc(l.voice)}</span></div>
      <div class="dm-body">${esc(l.dm)}</div>
    </div>
    <div class="btns">
      <a class="btn copy godm" href="${l.post_url}" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 4 3 11l7 3 2 6 3.5-4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m10 14 11-10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        Copy &amp; DM</a>
      <button class="btn ok mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Contacted</button>
      <button class="btn del">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13a1 1 0 0 0 1 .9h8a1 1 0 0 0 1-.9L18 7M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Delete</button>
    </div>`;
  const more = card.querySelector(".more");
  if (more) more.addEventListener("click", () => {
    const p = card.querySelector(".post");
    const open = p.classList.toggle("clamped");
    more.textContent = open ? "Read full post" : "Show less";
  });
  // One tap: the draft lands on the clipboard SYNCHRONOUSLY (survives leaving
  // the app), then the link opens the exact post — tap the poster's name there,
  // hit Message, and paste.
  card.querySelector(".godm").addEventListener("click", () => {
    if (!legacyCopy(l.dm)) copyDraft(l.dm); // sync copy first; async fallback
    toast("Draft copied — tap the poster's name, then Message, then paste");
  });
  card.querySelector(".mark").addEventListener("click", () => settle(l.id, "contacted", card));
  card.querySelector(".del").addEventListener("click",  () => settle(l.id, "deleted", card));
  return card;
}

function settle(id, action, cardEl){
  const map = action === "deleted" ? deleted : contacted;
  map[id] = { v: true, t: Date.now() };
  saveLocal(); pushShared(action, id);
  const doRender = () => { render(); };
  if (cardEl && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    cardEl.classList.add("leaving"); setTimeout(doRender, 300);
  } else doRender();
  toast(action === "deleted" ? "Post deleted" : "Marked contacted", () => {
    map[id] = { v: false, t: Date.now() };
    saveLocal(); pushShared(action, id); render();
  });
}

function emptyBlock(msg){
  const d = document.createElement("div");
  d.className = "empty reveal";
  d.innerHTML = `<svg viewBox="0 0 64 64" fill="none">
    <path d="M14 34h36c-2 8-8 12.5-15 14H27c-7-1.5-11-6-13-14Z" fill="rgba(255,255,255,.85)"/>
    <path d="M26 34v-7c0-1.4 1-2.4 2.4-2.4H38c4 0 7.2 2 9.4 5.4L49 34" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
    <path d="M8 52c4-2.8 8-2.8 12 0s8 2.8 12 0 8-2.8 12 0 8 2.8 12 0" stroke="#5FE3C6" stroke-width="2.6" stroke-linecap="round"/>
  </svg>${msg}`;
  return d;
}

function render(){
  const t1 = document.getElementById("leadsT1"), t2 = document.getElementById("leadsT2");
  t1.innerHTML = ""; t2.innerHTML = "";
  const live = LEADS.filter(l => !isHandled(l.id));
  live.forEach(l => (leadTier(l) === "tier1" ? t1 : t2).appendChild(leadCard(l)));
  if (!t1.children.length) t1.appendChild(emptyBlock("No Tier 1 leads right now — all caught up."));
  if (!t2.children.length) t2.appendChild(emptyBlock("Nothing in Tier 2 — smooth water."));
  renderHandled();
  updateCounts();
  watchReveals();
}

function renderHandled(){
  const wrap = document.getElementById("handledWrap"), list = document.getElementById("handledList");
  const rows = LEADS.filter(l => isHandled(l.id));
  document.getElementById("handledN").textContent = rows.length;
  wrap.style.display = rows.length ? "block" : "none";
  list.innerHTML = "";
  rows.forEach(l => {
    const del = isDeleted(l.id);
    const r = document.createElement("div");
    r.className = "hrow";
    r.innerHTML = `<span class="nm">${esc(l.name)}</span>
      <span class="st ${del ? "d" : "c"}">${del ? "DELETED" : "CONTACTED"}</span>
      <button class="undo">Undo</button>`;
    r.querySelector(".undo").addEventListener("click", () => {
      const action = del ? "deleted" : "contacted";
      (del ? deleted : contacted)[l.id] = { v: false, t: Date.now() };
      saveLocal(); pushShared(action, l.id); render();
    });
    list.appendChild(r);
  });
}

function updateCounts(){
  const live = LEADS.filter(l => !isHandled(l.id));
  const n1 = live.filter(l => leadTier(l) === "tier1").length;
  const n2 = live.length - n1;
  const set = (id,v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("nT1", n1); set("nT2", n2); set("cT1", n1); set("cT2", n2); set("heroNum", live.length);
  document.title = (n1 ? "(" + n1 + ") " : "") + "Boat Lead Desk";
  if ("setAppBadge" in navigator) {
    if (n1) navigator.setAppBadge(n1).catch(()=>{}); else navigator.clearAppBadge && navigator.clearAppBadge().catch(()=>{});
  }
}

// -------- Tier 1 instant alert --------
function chime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880,0],[1174.7,.14]].forEach(([f,at]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime + at);
      g.gain.linearRampToValueAtTime(.22, ctx.currentTime + at + .02);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + at + .5);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + .55);
    });
  } catch(e){}
}
function fireTierOneAlert(leads){
  const first = leads[0];
  // Subtle in-app cue only — the big announcement is the real push notification.
  toast(leads.length === 1 ? "New Tier 1 lead — " + first.name
                           : leads.length + " new Tier 1 leads");
  chime();
  if (navigator.vibrate) navigator.vibrate([130, 70, 130]);
  if ("Notification" in window && Notification.permission === "granted" && navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification("New Tier 1 lead", {
      body: leads.map(l => l.name + " — " + l.cat).join("\n"),
      icon: "icon-192.png", badge: "icon-192.png", tag: "bld-t1"
    })).catch(()=>{});
  }
}

// -------- real push (phone buzzes even when the app is closed) --------
function urlB64ToBytes(s){
  const raw = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function subscribePush(){
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: urlB64ToBytes(VAPID_PUBLIC)});
    // Register this phone with the shared store so the hourly task can reach it.
    const res = await fetchT(SYNC_URL, {method:"POST",
      body: JSON.stringify({action:"subscribe", sub: sub.toJSON(), t: Date.now()})}, 20000);
    const j = await res.json();
    if (!j || !j.ok) return false; // store not upgraded yet — retry on a later visit
    try { localStorage.setItem("bld-pushed", "1"); } catch(e){}
    return true;
  } catch(e){ return false; }
}

// bell — ask for notification permission, then register for real push
(function initBell(){
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    // Permission was granted earlier (or on a previous version) — make sure
    // this phone is registered for real push, quietly.
    if (!localStorage.getItem("bld-pushed")) subscribePush();
    return;
  }
  const btn = document.getElementById("bellBtn");
  btn.style.display = "flex";
  btn.addEventListener("click", async () => {
    try {
      const p = await Notification.requestPermission();
      if (p === "granted"){
        btn.style.display = "none";
        const pushed = await subscribePush();
        toast(pushed ? "Alerts on — this phone will buzz for Tier 1 leads"
                     : "In-app Tier 1 alerts are on");
      }
      else { toast("Alerts blocked — enable in Settings"); }
    } catch(e){}
  });
})();

// -------- toast (with undo) --------
let toastTimer, undoFn = null;
function hideToast(){
  clearTimeout(toastTimer);
  undoFn = null;
  document.getElementById("toast").classList.remove("show");
}
function toast(msg, onUndo){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  const u = document.getElementById("toastUndo");
  undoFn = onUndo || null;
  u.style.display = onUndo ? "inline" : "none";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), onUndo ? 6000 : 1800);
}
document.getElementById("toastUndo").addEventListener("click", () => {
  if (undoFn) undoFn();
  undoFn = null;
  document.getElementById("toast").classList.remove("show");
});

function copyDraft(text){
  const ok = () => toast("Draft copied — ready to paste");
  const fail = () => toast("Couldn't copy — long-press the text instead");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, () => legacyCopy(text) ? ok() : fail());
  } else { legacyCopy(text) ? ok() : fail(); }
}
function legacyCopy(text){
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

// -------- scroll progress --------
(function scrollFx(){
  const bar = document.getElementById("progress");
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
      ticking = false;
    });
  }, {passive:true});
})();

// tier tiles jump to their section
document.getElementById("tileT1").addEventListener("click", () =>
  document.getElementById("secT1").scrollIntoView({behavior:"smooth"}));
document.getElementById("tileT2").addEventListener("click", () =>
  document.getElementById("secT2").scrollIntoView({behavior:"smooth"}));

async function boot(){
  watchReveals();
  // Bundled leads render instantly (and offline); pullShared overrides with
  // the latest leads from the shared store when reachable.
  try {
    const res = await fetch("leads.json?t=" + Date.now(), {cache:"no-store"});
    applyLeadsDoc(await res.json());
  } catch(e){ toast("Couldn't load leads"); }
  render();
  pullShared();
  clearInterval(syncTimer);
  syncTimer = setInterval(pullShared, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      // Coming back from Facebook etc: iOS freezes timers while we're away,
      // which can leave a toast stranded on screen — clear it and refresh.
      hideToast();
      pullShared();
    }
  });
}
boot();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
